<!doctype html>
<!--
  The hub page of a subject site. It lists the books in books.json (written
  by tools/build_hub.py) as buttons. Each button shows the book's favicon,
  <folder>/images/favicon.png, and opens <folder>/.
  The subject's name comes from subject.json. No per-book text lives here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5b6470;
      --line: #d5dae1;
      --accent: #2b59c3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #14171c;
        --card: #1e232b;
        --text: #e8ebef;
        --muted: #a2abb7;
        --line: #343b46;
        --accent: #8fb0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    .count { margin: 0 0 1.5rem; color: var(--muted); }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      height: 100%;
      padding: 1rem .75rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--card);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .book:hover { border-color: var(--accent); }
    .book:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .icon {
      flex: none;
      width: 5rem;
      height: 5rem;
      border-radius: 1rem;
      object-fit: cover;
    }
    .icon.missing {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
    }
    .name { font-weight: 600; }
    .note { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Books</h1>
    <p class="count" id="count" aria-live="polite">Loading…</p>
    <ul class="books" id="books"></ul>
  </main>
  <script>
    (function showHub() {
      "use strict";

      var heading = document.getElementById("heading");
      var count = document.getElementById("count");
      var list = document.getElementById("books");

      /**
       * @param {string} file  a file next to this page
       * @returns {Promise<object>} the parsed JSON
       */
      function loadJson(file) {
        return fetch(file, { cache: "no-cache" }).then(function read(reply) {
          if (!reply.ok) {
            throw new Error(file + ": HTTP " + reply.status);
          }
          return reply.json();
        });
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} the picture, or a letter when the book's
       *   favicon cannot be loaded
       */
      function makeIcon(book) {
        var picture = document.createElement("img");
        picture.className = "icon";
        picture.alt = "";
        picture.width = 80;
        picture.height = 80;
        picture.src = book.folder + "/images/favicon.png";
        picture.addEventListener("error", function useLetter() {
          var letter = document.createElement("span");
          letter.className = "icon missing";
          letter.setAttribute("aria-hidden", "true");
          letter.textContent = (book.title || "?").charAt(0).toUpperCase();
          picture.replaceWith(letter);
        });
        return picture;
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} the list item with the book's button
       */
      function makeButton(book) {
        var item = document.createElement("li");
        var link = document.createElement("a");
        var name = document.createElement("span");
        link.className = "book";
        link.href = encodeURIComponent(book.folder) + "/";
        name.className = "name";
        name.textContent = book.title;
        link.appendChild(makeIcon(book));
        link.appendChild(name);
        item.appendChild(link);
        return item;
      }

      /**
       * @param {object} subject  subject.json
       * @param {object} index    books.json
       */
      function render(subject, index) {
        var books = index.books || [];
        if (subject.title) {
          heading.textContent = subject.title;
          document.title = subject.title;
        }
        books.forEach(function add(book) {
          list.appendChild(makeButton(book));
        });
        count.textContent = books.length === 0 ? "No books yet." :
          books.length + (books.length === 1 ? " book" : " books");
      }

      Promise.all([loadJson("subject.json"), loadJson("books.json")])
        .then(function done(files) { render(files[0], files[1]); })
        .catch(function failed() {
          count.className = "count note";
          count.textContent = "The book list could not be loaded. " +
            "Open this page through a web server, not from a folder.";
        });
    })();
  </script>
</body>
</html>
